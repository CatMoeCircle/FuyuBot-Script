[workspace]
members = ["crates/*"]
# 裸 `cargo build` 只编这三个；没有示例工程了（示例在文档站）。
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CatMoeCircle/FuyuBot-Script"

# 本仓库的 crate 全部是**分发资产**（cdylib / rlib），不发布到 crates.io。
# 唯一的外部依赖是运行时仓库发出的 `fuyubot-abi`。
# ⚠️ `0.1.3` 起是 ABI 6：VTable 尾部多了 `current_plugin` / `call_service` /
# `last_error` / `list_services` / `set_config_section`，服务调用改走宿主那条桥。
# 必须 ≥0.1.3——用 0.1.2（ABI 5）编出来的 dll 会被新宿主的 `AbiMismatch` 拒掉，
# 反过来 ABI 6 的 dll 也装不进 ABI 5 的宿主。
[workspace.dependencies]
fuyubot-abi = "0.1.3"
fuyubot-sdk-host = { path = "crates/fuyubot-sdk-host" }
fuyubot-sdk-native = { path = "crates/fuyubot-sdk-native" }
serde_json = "1.0.151"

[profile.debug]
inherits = "dev"
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
