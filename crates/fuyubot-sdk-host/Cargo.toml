[package]
name = "fuyubot-sdk-host"
description = "脚本插件的宿主侧共享逻辑：扫目录、装依赖、起进程、stdio 桥、子作用域"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# rlib：只被 fuyubot-script 链接，不单独分发。
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
fuyubot-abi.workspace = true
# 链接原生桥，让 `fuyubot_bridge_*` 跟着插件 dll 一起导出——脚本进程里加载的
# 同一个 dll 就靠这几个符号当原生后端。这里还负责用 `#[used]` 锚点钉住它们。
fuyubot-sdk-native.workspace = true
serde_json.workspace = true
